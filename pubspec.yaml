name: pepperlens_ai
description: "A new Flutter project for Pepper Disease Detection."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  permission_handler: ^12.0.1
  camera: ^0.12.0+1
  get: ^4.6.6
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  opencv_dart: ^1.4.5
  gal: ^2.3.2
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# Configuration flutter_launcher_icons to generate app icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#F8FAF8"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  # Enable Material Design components and icons
  uses-material-design: true

  # Register local image assets
  assets:
    - assets/images/
    - assets/images/disease_images/
    - assets/model/best_float32.tflite

  # Define costum fonts for the application
  fonts:
    # Font family Manrope
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800

    # Font family Poppins
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800
